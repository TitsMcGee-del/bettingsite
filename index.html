<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bet365 Elite Dashboard</title>
  
  <style>
    /* Bet365 Color Palette */
    :root {
      --b365-dark-green: #007355;
      --b365-bright-green: #12ed80;
      --b365-header-bg: #333333;
      --b365-body-bg: #282828;
      --b365-card-bg: #383838;
      --b365-text-white: #ffffff;
      --b365-text-gray: #bbbbbb;
      --b365-accent-yellow: #ffdf1b;
      --b365-border: #444444;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--b365-body-bg);
      color: var(--b365-text-white);
      margin: 0; padding: 0;
    }

    header {
      background-color: var(--b365-header-bg);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--b365-dark-green);
      position: sticky; top: 0; z-index: 100;
    }

    .refresh-btn {
      background: var(--b365-dark-green);
      color: white; border: none; padding: 8px 16px;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .refresh-btn:hover { background: var(--b365-bright-green); color: #000; }

    /* Navigation Tabs */
    .tab-bar { display: flex; background: #404040; border-bottom: 1px solid var(--b365-border); overflow-x: auto; }
    .tab-item {
      padding: 14px 24px; cursor: pointer; border-right: 1px solid var(--b365-border);
      font-size: 0.9rem; font-weight: 600; color: var(--b365-text-gray); white-space: nowrap;
    }
    .tab-item.active {
      background: var(--b365-card-bg); color: var(--b365-accent-yellow);
      border-bottom: 2px solid var(--b365-accent-yellow);
    }

    .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
    
    .card { background: var(--b365-card-bg); border-radius: 2px; margin-bottom: 20px; border: 1px solid var(--b365-border); }
    .card-header {
      background: #484848; padding: 12px 15px; font-weight: bold;
      color: var(--b365-bright-green); border-bottom: 1px solid var(--b365-border);
      text-transform: uppercase; font-size: 0.85rem;
    }
    .card-body { padding: 15px; }

    input, select {
      background: #444; border: 1px solid #555; color: white;
      padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box;
    }
    
    /* Compact inputs for history */
    input.hist-input {
      width: 40px; text-align: center; padding: 4px; display: inline-block; margin: 0 2px;
    }

    button.action-btn {
      background: var(--b365-accent-yellow); color: #000; border: none;
      padding: 12px; width: 100%; font-weight: bold; cursor: pointer;
      text-transform: uppercase; margin-top: 10px;
    }
    button.ghost-btn {
      background: #555; color: #fff; border: none; padding: 8px; width: 100%; cursor: pointer; margin-top: 5px;
    }
    button.small-btn {
      padding: 4px 8px; font-size: 0.8rem; cursor: pointer; border-radius: 3px; border:none; margin-left:5px;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; background: #333; color: var(--b365-text-gray); padding: 10px; font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 10px; border-bottom: 1px solid var(--b365-border); font-size: 0.9rem; vertical-align: middle; }

    .match-row { display: grid; grid-template-columns: 1fr 240px; padding: 15px; border-bottom: 1px solid var(--b365-border); }
    .odds-group { display: flex; gap: 8px; }
    .odd-box {
      background: #444; padding: 10px; text-align: center; flex: 1;
      cursor: pointer; border-radius: 2px; transition: 0.2s;
    }
    .odd-box:hover { background: #505050; border: 1px solid var(--b365-bright-green); }
    .odd-val { color: var(--b365-accent-yellow); font-weight: bold; display: block; font-size: 1.1rem; }
    .odd-lbl { font-size: 0.7rem; color: var(--b365-text-gray); }

    #login-screen { max-width: 400px; margin: 100px auto; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <div style="font-weight: 900; font-size: 1.6rem; color: var(--b365-bright-green); letter-spacing: -1px;">bet365</div>
    <div>
      <span id="headerUser" style="margin-right:15px; color:#aaa; font-size:0.9rem;"></span>
      <button class="refresh-btn" onclick="logout()">LOGOUT</button>
    </div>
  </header>

  <div id="login-screen">
    <div class="card">
      <div class="card-header">Member Login</div>
      <div class="card-body">
        <input id="userIn" placeholder="Username" />
        <input id="passIn" placeholder="Password" type="password" />
        <button class="action-btn" onclick="handleLogin()">Log In</button>
      </div>
    </div>
  </div>

  <div id="app" style="display:none">
    
    <div id="admin-tabs" class="tab-bar" style="display:none">
      <div class="tab-item active" onclick="switchTab('tab-matches', this)">Matches</div>
      <div class="tab-item" onclick="switchTab('tab-teams', this)">Team Admin</div>
      <div class="tab-item" onclick="switchTab('tab-users', this)">User Management</div>
    </div>

    <div class="container">
      
      <div id="admin-content" style="display:none">
        
        <div id="tab-matches" class="tab-pane">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div class="card">
              <div class="card-header">Initialize Match</div>
              <div class="card-body">
                <select id="gmHome"></select>
                <div style="text-align:center; padding: 5px; color: var(--b365-text-gray);">vs</div>
                <select id="gmAway"></select>
                
                <button class="ghost-btn" onclick="suggestOdds()">💡 Suggest Odds from Strength</button>

                <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top:10px">
                  <input id="o1" placeholder="1 (Odd)" />
                  <input id="oX" placeholder="X (Odd)" />
                  <input id="o2" placeholder="2 (Odd)" />
                </div>
                <button class="action-btn" onclick="createMatch()">Post Match</button>
              </div>
            </div>
            <div class="card">
              <div class="card-header">Open Settlements</div>
              <div id="admin-match-list" style="max-height: 400px; overflow-y: auto;"></div>
            </div>
          </div>
        </div>

        <div id="tab-teams" class="tab-pane" style="display:none">
          <div class="card">
            <div class="card-header">Register New Entry</div>
            <div class="card-body" style="display:flex; gap:10px; align-items: flex-end;">
              <div style="flex:2">
                <label style="font-size:0.7rem; color:#888">Team Name</label>
                <input id="tName" placeholder="e.g. Liverpool" />
              </div>
              <div style="flex:1">
                <label style="font-size:0.7rem; color:#888">Initial Group</label>
                <select id="tGroup">
                  <option value="A">Group A</option>
                  <option value="B">Group B</option>
                  <option value="C">Group C</option>
                  <option value="D">Group D</option>
                  <option value="E">Group E</option>
                </select>
              </div>
              <button class="action-btn" style="flex:1; margin-top:0; height: 42px;" onclick="registerTeam()">Add Team</button>
            </div>
          </div>
          <div class="card">
            <div class="card-header">Team Strength & Group Management</div>
            <div style="overflow-x:auto;">
              <table id="admin-teams-table">
                <thead>
                  <tr>
                    <th>Team</th>
                    <th>Group</th>
                    <th>Form History (Recent -> Old)</th>
                    <th>Strength</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="admin-teams-body"></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="tab-users" class="tab-pane" style="display:none">
          <div class="card">
            <div class="card-header">Active Users</div>
            <div id="user-list-admin"></div>
          </div>
        </div>
      </div>

      <div id="user-content" style="display:none">
        <div class="card" style="border-left: 5px solid var(--b365-bright-green);">
          <div class="card-body" style="display:flex; justify-content:space-between; align-items:center">
            <div><span style="color:#888">User:</span> <strong id="display-name"></strong></div>
            <div style="font-size: 1.2rem;">Balance: <strong style="color:var(--b365-accent-yellow)" id="display-balance">0</strong></div>
          </div>
        </div>
        <div class="card">
          <div class="card-header">Soccer - Live & Upcoming</div>
          <div id="user-betting-odds"></div>
        </div>
      </div>

      <div id="standings-area" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:15px; margin-top:20px;"></div>

    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDPgcnptW0O2OFlE-_TOsTXctjG6RPBZm8",
    authDomain: "fc26-full-bets.firebaseapp.com",
    databaseURL: "https://fc26-full-bets-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "fc26-full-bets",
    storageBucket: "fc26-full-bets.firebasestorage.app",
    messagingSenderId: "549879537827",
    appId: "1:549879537827:web:cde58dd532e7e6ffde5f16"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentUser = null;
  let isAdmin = false;

  // --- AUTH / SESSION HANDLING ---
  // Check localStorage on load
  window.onload = function() {
    const savedUser = localStorage.getItem('bet365_user');
    const savedAdmin = localStorage.getItem('bet365_isAdmin');
    
    if (savedUser) {
      currentUser = savedUser;
      isAdmin = (savedAdmin === 'true');
      launch();
    }
  };

  function handleLogin() {
    const user = document.getElementById('userIn').value.trim();
    const pass = document.getElementById('passIn').value;

    if (user === 'Admin' && pass === 'IBM99ibm') {
      setUserSession('Admin', true);
    } else {
      db.ref('users/'+user).once('value', s => {
        const d = s.val();
        if (d && d.pass === pass) { 
          setUserSession(user, false);
        } else {
          alert('Invalid Login');
        }
      });
    }
  }

  function setUserSession(user, adminStatus) {
    currentUser = user;
    isAdmin = adminStatus;
    localStorage.setItem('bet365_user', user);
    localStorage.setItem('bet365_isAdmin', adminStatus);
    launch();
  }

  function logout() {
    localStorage.removeItem('bet365_user');
    localStorage.removeItem('bet365_isAdmin');
    location.reload();
  }

  function launch() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('display-name').textContent = currentUser;
    document.getElementById('headerUser').textContent = currentUser; // show in header too

    if (isAdmin) {
      document.getElementById('admin-tabs').style.display = 'flex';
      document.getElementById('admin-content').style.display = 'block';
    } else {
      document.getElementById('user-content').style.display = 'block';
      db.ref(`users/${currentUser}/credits`).on('value', s => {
        document.getElementById('display-balance').textContent = s.val() || 0;
      });
    }
    initListeners();
  }

  function switchTab(id, el) {
    document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    el.classList.add('active');
  }

  // --- LOGIC ---
  async function registerTeam() {
    const name = document.getElementById('tName').value.trim();
    const group = document.getElementById('tGroup').value;
    if (!name) return;
    const id = 't_' + Date.now();
    try {
      await db.ref('teams/' + id).set({ 
        id, name, group, history: ['-','-','-','-','-'] 
      });
      document.getElementById('tName').value = '';
    } catch(e) { alert("Permission Denied."); }
  }

  async function updateTeamData(id, field, value) {
    await db.ref(`teams/${id}/${field}`).set(value);
  }

  async function updateHistory(id, index, val) {
    const clean = val.trim() === '-' ? '-' : (parseFloat(val) || 0);
    await db.ref(`teams/${id}/history/${index}`).set(clean);
  }

  // Feature: Shift History
  async function shiftHistory(id) {
    // get current history
    const snap = await db.ref(`teams/${id}/history`).get();
    let arr = snap.val() || ['-','-','-','-','-'];
    
    // Shift: [0]<-[1], [1]<-[2], etc. Last becomes '-'
    for(let i=0; i < arr.length - 1; i++) {
      arr[i] = arr[i+1];
    }
    arr[arr.length - 1] = '-'; // clear last col

    await db.ref(`teams/${id}/history`).set(arr);
  }

  async function deleteTeam(id) {
    if(confirm('Remove team?')) await db.ref(`teams/${id}`).remove();
  }

  // --- ODDS & STRENGTH (FIXED for 0 strength) ---
  async function suggestOdds() {
    const hId = document.getElementById('gmHome').value;
    const aId = document.getElementById('gmAway').value;
    if(!hId || !aId || hId === aId) return alert("Select two different teams");

    const [t1, t2] = await Promise.all([
      db.ref('teams/'+hId).get(),
      db.ref('teams/'+aId).get()
    ]);
    
    let sH = calcStrength(t1.val().history);
    let sA = calcStrength(t2.val().history);

    // FIX: If both are 0, treat them as equal strength (e.g. 1.0 each) to avoid divide by zero
    if (sH === 0 && sA === 0) { sH = 1; sA = 1; }
    
    // FIX: If only one is 0, give it a tiny value so odds aren't infinite
    if (sH === 0) sH = 0.1;
    if (sA === 0) sA = 0.1;

    const total = sH + sA;

    // Probabilities
    const pH = (sH / total) * 0.88; // 88% return (house edge)
    const pA = (sA / total) * 0.88; 
    const pX = 0.12; // Fixed draw probability component

    // Convert to Decimals
    const o1 = (1 / pH).toFixed(2);
    const oX = (1 / pX).toFixed(2); // usually around 8.0 with this logic, can tweak manually
    const o2 = (1 / pA).toFixed(2);

    // Reasonable cap for Draw if it gets too wild
    const finalOX = Math.min(Math.max(oX, 2.50), 6.50).toFixed(2); 

    document.getElementById('o1').value = o1;
    document.getElementById('oX').value = finalOX; 
    document.getElementById('o2').value = o2;
  }

  function calcStrength(hist) {
    if (!hist) return 0; 
    const nums = hist.filter(x => x !== '-' && !isNaN(parseFloat(x))).map(Number);
    if (nums.length === 0) return 0; 
    return nums.reduce((a,b) => a+b, 0) / nums.length;
  }

  // --- MATCHES ---
  function createMatch() {
    const hId = document.getElementById('gmHome').value;
    const aId = document.getElementById('gmAway').value;
    const hName = document.querySelector('#gmHome option:checked').textContent;
    const aName = document.querySelector('#gmAway option:checked').textContent;
    const odds = { 
      '1': document.getElementById('o1').value, 
      'X': document.getElementById('oX').value, 
      '2': document.getElementById('o2').value 
    };
    db.ref('matches/m_'+Date.now()).set({ home: hName, homeId: hId, away: aName, awayId: aId, odds, result: null });
  }

  async function setScore(id) {
    const res = prompt("Enter Final Score (e.g. 1-1)");
    if (res && /^\d+-\d+$/.test(res)) {
      await db.ref(`matches/${id}/result`).set(res);
    }
  }

  // --- RENDERERS ---
  function initListeners() {
    db.ref('teams').on('value', s => {
      const teams = Object.values(s.val() || {});
      updateDropdowns(teams);
      if (isAdmin) renderAdminTeamsTable(teams);
      updateStandings(teams);
    });

    db.ref('matches').on('value', s => {
      const matches = s.val() || {};
      if (isAdmin) renderAdminMatches(matches);
      else renderUserOdds(matches);
    });
  }

  function updateDropdowns(teams) {
    const opts = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    document.getElementById('gmHome').innerHTML = opts;
    document.getElementById('gmAway').innerHTML = opts;
  }

  function renderAdminTeamsTable(teams) {
    const groups = ['A','B','C','D','E'];
    const html = teams.map(t => {
      const hist = t.history || ['-','-','-','-','-'];
      const str = calcStrength(hist).toFixed(2);
      
      const histInputs = hist.map((val, i) => 
        `<input class="hist-input" value="${val}" onchange="updateHistory('${t.id}', ${i}, this.value)">`
      ).join('');

      const grpSelect = `<select style="margin:0; padding:4px; width:auto;" onchange="updateTeamData('${t.id}', 'group', this.value)">
          ${groups.map(g => `<option value="${g}" ${t.group===g?'selected':''}>${g}</option>`).join('')}
        </select>`;

      return `<tr>
        <td><strong>${t.name}</strong></td>
        <td>${grpSelect}</td>
        <td style="white-space:nowrap">
          <button class="small-btn" style="background:#444; color:#fff" onclick="shiftHistory('${t.id}')">⬅ Shift</button>
          ${histInputs}
        </td>
        <td style="color:var(--b365-accent-yellow); font-weight:bold;">${str}</td>
        <td>
          <button onclick="deleteTeam('${t.id}')" style="background:transparent; color:#ff4444; border:none; cursor:pointer;">X</button>
        </td>
      </tr>`;
    }).join('');
    document.getElementById('admin-teams-body').innerHTML = html;
  }

  function renderAdminMatches(matches) {
    const html = Object.entries(matches).map(([id, m]) => `
      <div style="padding:12px; border-bottom:1px solid #444; display:flex; justify-content:space-between; align-items:center;">
        <span style="font-size:0.85rem">${m.home} vs ${m.away}</span>
        <button class="refresh-btn" style="font-size:0.7rem; padding:4px 8px;" onclick="setScore('${id}')">${m.result || 'Settlement'}</button>
      </div>
    `).join('');
    document.getElementById('admin-match-list').innerHTML = html || 'No matches.';
  }

  function renderUserOdds(matches) {
    const html = Object.entries(matches).filter(([id, m]) => !m.result).map(([id, m]) => `
      <div class="match-row">
        <div><div style="font-weight:bold">${m.home}</div><div style="font-weight:bold">${m.away}</div></div>
        <div class="odds-group">
          <div class="odd-box"><span class="odd-lbl">1</span><span class="odd-val">${m.odds['1']}</span></div>
          <div class="odd-box"><span class="odd-lbl">X</span><span class="odd-val">${m.odds['X']}</span></div>
          <div class="odd-box"><span class="odd-lbl">2</span><span class="odd-val">${m.odds['2']}</span></div>
        </div>
      </div>
    `).join('');
    document.getElementById('user-betting-odds').innerHTML = html || '<div style="padding:20px; color:#888;">No active markets.</div>';
  }

  async function updateStandings(teams) {
    const mSnap = await db.ref('matches').get();
    const matches = mSnap.val() || {};
    const stats = {};
    Object.values(matches).forEach(m => {
      if(!m.result) return;
      const [hG, aG] = m.result.split('-').map(Number);
      [m.homeId, m.awayId].forEach(id => stats[id] = stats[id] || {p:0, gd:0});
      stats[m.homeId].gd += (hG-aG); stats[m.awayId].gd += (aG-hG);
      if(hG>aG) stats[m.homeId].p+=3; else if(aG>hG) stats[m.awayId].p+=3; else { stats[m.homeId].p+=1; stats[m.awayId].p+=1; }
    });

    const groups = ['A','B','C','D','E'];
    document.getElementById('standings-area').innerHTML = groups.map(g => {
      const gTeams = teams.filter(t => t.group === g).map(t => ({n: t.name, ...stats[t.id]||{p:0, gd:0}})).sort((a,b) => b.p - a.p || b.gd - a.gd);
      if(gTeams.length === 0) return '';
      return `<div class="card"><div class="card-header">Group ${g}</div><div class="card-body">
        <table>${gTeams.map(t => `<tr><td>${t.n}</td><td style="text-align:right"><strong>${t.p}</strong></td><td style="text-align:right; color:#888; font-size:0.7rem">${t.gd}GD</td></tr>`).join('')}</table>
      </div></div>`;
    }).join('');
  }
</script>
</body>
</html>
