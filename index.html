<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bet365 Elite Dashboard</title>
  
  <style>
    /* Bet365 Color Palette */
    :root {
      --b365-dark-green: #007355;
      --b365-bright-green: #12ed80;
      --b365-header-bg: #333333;
      --b365-body-bg: #282828;
      --b365-card-bg: #383838;
      --b365-text-white: #ffffff;
      --b365-text-gray: #bbbbbb;
      --b365-accent-yellow: #ffdf1b;
      --b365-border: #444444;
      --b365-red: #d32f2f;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--b365-body-bg);
      color: var(--b365-text-white);
      margin: 0; padding: 0;
      padding-bottom: 70px;
    }

    header {
      background-color: var(--b365-header-bg);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--b365-dark-green);
      position: sticky; top: 0; z-index: 100;
    }

    .logo { font-weight: bold; font-size: 1.4rem; color: var(--b365-bright-green); letter-spacing: -1px; }
    .logo span { color: white; }

    nav {
      background: #333;
      display: flex;
      overflow-x: auto;
      border-bottom: 1px solid #444;
      position: sticky; top: 53px; z-index: 99;
    }
    nav button {
      background: none; border: none; color: var(--b365-text-gray);
      padding: 12px 20px; cursor: pointer; font-size: 0.85rem;
      white-space: nowrap; font-weight: 600; text-transform: uppercase;
    }
    nav button.active { color: var(--b365-bright-green); border-bottom: 2px solid var(--b365-bright-green); }

    .container { padding: 15px; max-width: 1200px; margin: auto; }

    .card {
      background: var(--b365-card-bg);
      border-radius: 4px; margin-bottom: 15px;
      border: 1px solid var(--b365-border);
      overflow: hidden;
    }
    .card-header {
      background: #404040; padding: 10px 15px;
      font-size: 0.8rem; font-weight: bold; color: var(--b365-text-gray);
      text-transform: uppercase; border-bottom: 1px solid var(--b365-border);
    }
    .card-body { padding: 15px; }

    .refresh-btn {
      background: var(--b365-dark-green);
      color: white; border: none; padding: 8px 16px;
      border-radius: 4px; cursor: pointer; font-weight: bold;
    }
    .refresh-btn:hover { background: var(--b365-bright-green); color: #000; }

    input, select {
      background: #444; border: 1px solid #555; color: #fff; padding: 8px; border-radius: 4px; margin: 5px 0;
    }

    .match-row { display: grid; grid-template-columns: 1fr 240px; padding: 15px; border-bottom: 1px solid var(--b365-border); }
    @media (max-width: 600px) { .match-row { grid-template-columns: 1fr; gap: 10px; } }
    
    .odds-group { display: flex; gap: 8px; }
    .odd-box {
      background: #444; padding: 10px; text-align: center; flex: 1;
      cursor: pointer; border-radius: 2px; transition: 0.2s;
    }
    .odd-box:hover { background: #505050; border: 1px solid var(--b365-bright-green); }
    .odd-box.admin-disabled { cursor: default; opacity: 0.8; }
    .odd-box.admin-disabled:hover { border: none; background: #444; }
    .odd-val { color: var(--b365-accent-yellow); font-weight: bold; display: block; font-size: 1.1rem; }
    .odd-lbl { font-size: 0.7rem; color: var(--b365-text-gray); }

    .bracket-container {
        display: flex; justify-content: space-around; align-items: center; padding: 20px; background: #333; overflow-x: auto;
    }
    .bracket-col { display: flex; flex-direction: column; gap: 40px; }
    .bracket-match { border: 1px solid #555; background: #444; padding: 10px; width: 200px; text-align: center; position:relative;}
    .bracket-status { font-size:0.7rem; color:var(--b365-accent-yellow); position:absolute; top:2px; right:5px; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; background: #333; color: var(--b365-text-gray); padding: 10px; font-size: 0.75rem; text-transform: uppercase; }
    td { padding: 10px; border-bottom: 1px solid var(--b365-border); font-size: 0.9rem; }

    .action-btn {
      background: var(--b365-accent-yellow); color: #000; border: none;
      padding: 12px; width: 100%; font-weight: bold; cursor: pointer;
      text-transform: uppercase; margin-top: 10px;
    }
    .delete-btn { background: var(--b365-red); color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 3px; font-weight: bold; }

    .chat-container { height: 300px; overflow-y: auto; padding: 10px; background: #222; display: flex; flex-direction: column; gap: 8px; border-radius: 4px; }
    .chat-msg { font-size: 0.85rem; padding: 6px 12px; border-radius: 4px; background: #333; align-self: flex-start; max-width: 85%; }
    .chat-msg b { color: var(--b365-bright-green); margin-right: 5px; }

    #bet-slip {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 500px; background: #383838;
      border-top: 3px solid var(--b365-bright-green);
      z-index: 1000; transition: 0.3s ease-in-out;
      box-shadow: 0 -5px 25px rgba(0,0,0,0.6);
    }
    #bet-slip.collapsed { height: 50px; overflow: hidden; cursor: pointer; }
    #bet-slip.expanded { height: auto; max-height: 85vh; overflow-y: auto; }
    
    .slip-header {
      padding: 15px; display: flex; justify-content: space-between; align-items: center;
      background: #2a2a2a; font-weight: bold; border-bottom: 1px solid #444;
    }
    .slip-badge { background: var(--b365-bright-green); color: #000; border-radius: 50%; padding: 2px 8px; font-size: 0.8rem; }
    .slip-item { padding: 12px 15px; border-bottom: 1px solid #444; position: relative; background: #444; margin-bottom: 2px; }
    .slip-remove { position: absolute; right: 10px; top: 10px; color: #888; cursor: pointer; font-size: 1.2rem; }

    #login-screen { max-width: 400px; margin: 100px auto; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-database-compat.js"></script>
</head>
<body>

  <!-- LOGIN -->
  <div id="login-screen" class="card">
    <div class="card-header">Member Login</div>
    <div class="card-body">
      <input type="text" id="userIn" placeholder="Username" style="width:100%" onkeypress="checkEnter(event)" />
      <input type="password" id="passIn" placeholder="Password" style="width:100%" onkeypress="checkEnter(event)" />
      <button class="action-btn" onclick="handleLogin()">Login</button>
    </div>
  </div>

  <!-- APP CONTENT -->
  <div id="app" style="display:none">
    <header>
      <div class="logo">bet365 <span>Elite</span></div>
      <div style="text-align:right">
        <span id="headerUser" style="font-weight:bold; color:#aaa; font-size:0.8rem;"></span><br>
        <span id="display-balance" style="color:var(--b365-bright-green); font-weight:bold">$0.00</span>
      </div>
    </header>

    <nav>
      <button class="nav-btn active" onclick="switchTab('matches', this)">Sports</button>
      <button class="nav-btn" onclick="switchTab('standings', this)">Standings</button>
      <button class="nav-btn" onclick="switchTab('my-bets', this)">My Bets</button>
      <button class="nav-btn" onclick="switchTab('leaderboard', this)">Leaderboard</button>
      <button class="nav-btn" onclick="switchTab('chat', this)">Chat</button>
      <button id="admin-nav" class="nav-btn" onclick="switchTab('admin', this)" style="display:none; color:var(--b365-accent-yellow)">Admin</button>
    </nav>

    <div class="container">
      
      <!-- TAB: MATCHES -->
      <div id="tab-matches" class="tab-pane">
        <div id="bracket-display" class="bracket-container" style="display:none; margin-bottom:20px;"></div>
        <div id="match-list"></div>
      </div>

      <!-- TAB: STANDINGS -->
      <div id="tab-standings" class="tab-pane" style="display:none">
        <div id="standings-area" style="display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:15px;"></div>
      </div>

      <!-- TAB: MY BETS -->
      <div id="tab-my-bets" class="tab-pane" style="display:none">
        <div class="card">
            <div class="card-header">Your Active Tickets</div>
            <div id="user-tickets"></div>
        </div>
      </div>

      <!-- TAB: LEADERBOARD -->
      <div id="tab-leaderboard" class="tab-pane" style="display:none">
        <div class="card">
            <div class="card-header">Global Rankings</div>
            <div id="leaderboard-content"></div>
        </div>
      </div>

      <!-- TAB: CHAT -->
      <div id="tab-chat" class="tab-pane" style="display:none">
        <div class="card">
            <div class="card-header">Group Chat</div>
            <div class="chat-container" id="chat-box"></div>
            <div style="padding:10px; display:flex; gap:5px;">
                <input type="text" id="chatInput" placeholder="Write a message..." style="flex:1; margin:0">
                <button class="refresh-btn" onclick="sendChat()">Send</button>
            </div>
        </div>
      </div>

      <!-- TAB: ADMIN -->
      <div id="tab-admin" class="tab-pane" style="display:none">
        
        <div class="card">
            <div class="card-header">Open Tickets (All Users)</div>
            <div id="admin-all-tickets" style="padding:10px; max-height:400px; overflow-y:auto;"></div>
        </div>

        <div class="card">
            <div class="card-header">Register Team</div>
            <div class="card-body" style="display:flex; gap:10px; align-items:flex-end;">
                <div style="flex:2"><label style="font-size:0.7rem">Name</label><input id="tName" style="width:100%"/></div>
                <div style="flex:1"><label style="font-size:0.7rem">Grp</label><select id="tGroup" style="width:100%"><option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option><option value="E">E</option></select></div>
                <button class="refresh-btn" onclick="registerTeam()">Add</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">Tournament Management</div>
            <div class="card-body">
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <button class="refresh-btn" onclick="generateGroupMatches(1)">Groups (1 Leg)</button>
                    <button class="refresh-btn" style="background:#fff; color:#000" onclick="generateGroupMatches(2)">Groups (2 Legs)</button>
                </div>
                <div style="background:#444; padding:10px; border-radius:4px;">
                    <label style="font-size:0.7rem">Finals Bracket</label>
                    <div style="display:flex; gap:5px; flex-wrap:wrap;">
                        SF1: <select id="brSF1H"></select> v <select id="brSF1A"></select>
                        SF2: <select id="brSF2H"></select> v <select id="brSF2A"></select>
                        <button class="refresh-btn" onclick="initBracket()">Start Bracket</button>
                    </div>
                </div>
                <button class="delete-btn" style="width:100%; margin-top:10px;" onclick="archiveTournament()">📦 ARCHIVE SEASON & SHIFT HISTORY</button>
            </div>
        </div>
        <div id="admin-match-list"></div>
        <div id="admin-user-list"></div>
      </div>

    </div>

    <!-- BET SLIP -->
    <div id="bet-slip" class="collapsed" style="display:none">
        <div class="slip-header" onclick="toggleSlip()">
            <span>BET SLIP <span class="slip-badge" id="slip-count">0</span></span>
            <span id="slip-arrow">▲</span>
        </div>
        <div id="slip-items"></div>
        <div style="padding:15px; background:#2a2a2a; border-top:1px solid #555;">
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span style="font-size:0.8rem">Total Odds:</span>
                <span id="slip-total-odds" style="color:var(--b365-accent-yellow); font-weight:bold">1.00</span>
            </div>
            <input type="number" id="slip-stake" placeholder="Stake Amount" style="width:100%; margin-bottom:10px;" />
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span style="font-size:0.8rem">Potential Payout:</span>
                <span id="slip-payout" style="color:var(--b365-bright-green); font-weight:bold">$0.00</span>
            </div>
            <button class="action-btn" onclick="placeTicket()">Place Ticket</button>
        </div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDPgcnptW0O2OFlE-_TOsTXctjG6RPBZm8",
    authDomain: "fc26-full-bets.firebaseapp.com",
    databaseURL: "https://fc26-full-bets-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "fc26-full-bets",
    storageBucket: "fc26-full-bets.firebasestorage.app",
    messagingSenderId: "549879537827",
    appId: "1:549879537827:web:cde58dd532e7e6ffde5f16"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentUser = null;
  let isAdmin = false;
  let globalTeams = []; 
  let globalMatches = {};
  let betSlip = [];

  function checkEnter(e) { if(e.key === 'Enter') handleLogin(); }

  function handleLogin() {
    const u = document.getElementById('userIn').value.trim();
    const p = document.getElementById('passIn').value;
    if(!u || !p) return;

    if(u === 'Admin' && p === 'IBM99ibm') {
        currentUser = 'Admin'; isAdmin = true; launch();
    } else {
        db.ref('users/'+u).once('value', s => {
            const d = s.val();
            if(d) {
                if(d.pass === p) { currentUser = u; isAdmin = false; launch(); }
                else alert("Invalid credentials");
            } else {
                db.ref('users/'+u).set({ pass: p, credits: 100, initialCredits: 100 }).then(() => {
                    currentUser = u; isAdmin = false; launch();
                });
            }
        });
    }
  }

  function launch() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('headerUser').textContent = currentUser;
    if(isAdmin) {
        document.getElementById('admin-nav').style.display = 'block';
        document.getElementById('bet-slip').style.display = 'none';
        document.getElementById('display-balance').style.display = 'none';
    } else {
        document.getElementById('bet-slip').style.display = 'block';
    }
    initListeners();
  }

  function switchTab(id, btn) {
    document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-'+id).style.display = 'block';
    btn.classList.add('active');
  }

  function initListeners() {
    db.ref('teams').on('value', s => {
        globalTeams = Object.values(s.val() || {});
        updateDropdowns();
        if(isAdmin) renderAdminTeams();
        updateStandings();
    });
    db.ref('matches').on('value', s => {
        globalMatches = s.val() || {};
        renderMatches();
        if(isAdmin) renderAdminMatches();
        updateStandings();
        renderBracket();
    });
    if(!isAdmin) {
        db.ref('users/' + currentUser + '/credits').on('value', s => {
            document.getElementById('display-balance').textContent = `$${(s.val() || 0).toFixed(2)}`;
        });
        db.ref('tickets/' + currentUser).on('value', s => renderUserTickets(s.val()));
    } else {
        db.ref('tickets').on('value', s => renderAdminAllTickets(s.val()));
    }
    db.ref('chat').limitToLast(15).on('value', s => renderChat(s.val()));
    db.ref('users').on('value', s => renderLeaderboard(s.val()));
  }

  // --- ORIGINAL STRENGTH & ODDS LOGIC ---
  function calcStrength(hist) {
    if (!hist) return 0; 
    const nums = hist.filter(x => x !== '-' && !isNaN(parseFloat(x))).map(Number);
    if (nums.length === 0) return 0; 
    return nums.reduce((a,b) => a+b, 0) / nums.length;
  }

  function calculateOddsForTeams(t1, t2) {
    const s1 = calcStrength(t1.history);
    const s2 = calcStrength(t2.history);
    const diff = s1 - s2; 
    let p1 = 0.38, pX = 0.28, p2 = 0.34;
    p1 += (diff * 0.05); p2 -= (diff * 0.05);
    p1 = Math.max(0.1, Math.min(0.8, p1));
    p2 = Math.max(0.1, Math.min(0.8, p2));
    pX = 1 - p1 - p2;
    return {
        '1': (1 / p1).toFixed(2),
        'X': (1 / pX).toFixed(2),
        '2': (1 / p2).toFixed(2)
    };
  }

  // --- ADMIN FUNCTIONS ---
  function registerTeam() {
    const name = document.getElementById('tName').value;
    const grp = document.getElementById('tGroup').value;
    if(!name) return;
    const id = 't_' + Date.now();
    db.ref('teams/'+id).set({ id, name, group: grp, history: [0,0,0,0,0] });
  }

  async function generateGroupMatches(legs) {
    if(!confirm("Generate group matches?")) return;
    const grouped = {};
    globalTeams.forEach(t => {
        if(t.group === 'E') return; // Preserving exclusion
        if(!grouped[t.group]) grouped[t.group] = [];
        grouped[t.group].push(t);
    });
    const updates = {};
    Object.keys(grouped).forEach(grp => {
        const teams = grouped[grp];
        for (let i = 0; i < teams.length; i++) {
            for (let j = i + 1; j < teams.length; j++) {
                const tA = teams[i], tB = teams[j];
                const odds1 = calculateOddsForTeams(tA, tB);
                const mid1 = 'm_' + Date.now() + Math.random();
                updates[`matches/${mid1}`] = { home: tA.name, homeId: tA.id, away: tB.name, awayId: tB.id, odds: odds1, result: null, group: grp };
                if(legs === 2) {
                    const odds2 = calculateOddsForTeams(tB, tA);
                    const mid2 = 'm_' + Date.now() + Math.random();
                    updates[`matches/${mid2}`] = { home: tB.name, homeId: tB.id, away: tA.name, awayId: tA.id, odds: odds2, result: null, group: grp };
                }
            }
        }
    });
    await db.ref().update(updates);
  }

  async function adminSetResult(mId) {
    const score = prompt("Result (H-A):");
    if(!score || !score.includes('-')) return;
    const [h, a] = score.split('-').map(Number);
    let winOutcome = 'X'; if(h>a) winOutcome = '1'; else if(a>h) winOutcome = '2';

    const updates = {};
    updates[`matches/${mId}/result`] = score;

    const tSnap = await db.ref('tickets').once('value');
    const allUsersTickets = tSnap.val() || {};

    for(const [user, tickets] of Object.entries(allUsersTickets)) {
        for(const [tId, tkt] of Object.entries(tickets)) {
            if(tkt.status !== 'open') continue;
            const leg = tkt.legs.find(l => l.mId === mId);
            if(leg) {
                if(leg.pick !== winOutcome) {
                    updates[`tickets/${user}/${tId}/status`] = 'lost';
                } else {
                    const allWon = tkt.legs.every(l => {
                        const mObj = globalMatches[l.mId];
                        const mRes = (l.mId === mId) ? score : mObj.result;
                        if(!mRes) return false;
                        const [lh, la] = mRes.split('-').map(Number);
                        let lWin = 'X'; if(lh>la) lWin='1'; else if(la>lh) lWin='2';
                        return l.pick === lWin;
                    });
                    if(allWon) {
                        updates[`tickets/${user}/${tId}/status`] = 'won';
                        const uSnap = await db.ref(`users/${user}/credits`).get();
                        updates[`users/${user}/credits`] = (uSnap.val() || 0) + tkt.payout;
                    }
                }
            }
        }
    }
    await db.ref().update(updates);
    if(mId === 'm_sf1' || mId === 'm_sf2') checkBracketAdvancement();
  }

  async function archiveTournament() {
      if(!confirm("📦 CALCULATE HISTORY & WIPE?")) return;
      const teamPoints = {}; globalTeams.forEach(t => teamPoints[t.id] = 0);
      Object.values(globalMatches).forEach(m => {
          if(!m.result) return;
          const [h, a] = m.result.split('-').map(Number);
          if(h>a) teamPoints[m.homeId] += 3; else if(a>h) teamPoints[m.awayId] += 3; else { teamPoints[m.homeId]+=1; teamPoints[m.awayId]+=1; }
          if(m.stage === 'FINAL' && m.result) {
              const winId = h > a ? m.homeId : m.awayId;
              teamPoints[winId] += 5;
          }
      });
      const updates = {};
      globalTeams.forEach(t => {
          let h = t.history ? [...t.history] : [0,0,0,0,0];
          h.shift(); h.push(teamPoints[t.id] || 0);
          updates[`teams/${t.id}/history`] = h;
      });
      updates['matches'] = null; updates['tickets'] = null;
      await db.ref().update(updates);
      alert("Season Archived. History shifted.");
  }

  // --- USER BETTING LOGIC ---
  function toggleSlip() {
    if(isAdmin) return;
    const s = document.getElementById('bet-slip');
    const a = document.getElementById('slip-arrow');
    if(s.classList.contains('collapsed')) { s.classList.replace('collapsed', 'expanded'); a.textContent = '▼'; }
    else { s.classList.replace('expanded', 'collapsed'); a.textContent = '▲'; }
  }

  function addToSlip(mId, pick, odds) {
    if(isAdmin) return;
    if(betSlip.find(i => i.mId === mId)) betSlip = betSlip.filter(i => i.mId !== mId);
    const m = globalMatches[mId];
    betSlip.push({ mId, pick, odds: parseFloat(odds), home: m.home, away: m.away });
    renderSlip();
    const s = document.getElementById('bet-slip');
    if(s.classList.contains('collapsed')) toggleSlip();
  }

  function removeFromSlip(mId) {
    betSlip = betSlip.filter(i => i.mId !== mId);
    renderSlip();
  }

  function renderSlip() {
    const count = betSlip.length;
    document.getElementById('slip-count').textContent = count;
    let totalOdds = 1.0;
    const html = betSlip.map(i => {
        totalOdds *= i.odds;
        return `<div class="slip-item">
            <span class="slip-remove" onclick="removeFromSlip('${i.mId}')">×</span>
            <div style="font-size:0.7rem; color:#aaa">${i.home} v ${i.away}</div>
            <div style="font-weight:bold">${i.pick} <span style="color:var(--b365-accent-yellow)">@${i.odds}</span></div>
        </div>`;
    }).join('');
    document.getElementById('slip-items').innerHTML = html || '<div style="padding:20px; text-align:center; color:#888">No selections</div>';
    document.getElementById('slip-total-odds').textContent = totalOdds.toFixed(2);
    
    const stakeIn = document.getElementById('slip-stake');
    stakeIn.oninput = () => {
        const stake = parseFloat(stakeIn.value) || 0;
        document.getElementById('slip-payout').textContent = `$${(stake * totalOdds).toFixed(2)}`;
    };
  }

  async function placeTicket() {
    if(isAdmin) return;
    if(betSlip.length === 0) return;
    const stake = parseFloat(document.getElementById('slip-stake').value);
    if(!stake || stake <= 0) return alert("Enter stake");
    const snap = await db.ref(`users/${currentUser}/credits`).get();
    const bal = snap.val() || 0;
    if(bal < stake) return alert("Insufficient funds");

    let totalOdds = 1.0; betSlip.forEach(i => totalOdds *= i.odds);
    const ticketId = 'tkt_' + Date.now();
    const ticket = { legs: betSlip, stake, totalOdds, status: 'open', payout: stake * totalOdds, ts: Date.now() };

    const updates = {};
    updates[`tickets/${currentUser}/${ticketId}`] = ticket;
    updates[`users/${currentUser}/credits`] = bal - stake;
    await db.ref().update(updates);
    betSlip = []; renderSlip(); toggleSlip();
    alert("Ticket Placed!");
  }

  // --- RENDERING VIEWS ---
  function renderMatches() {
    const grouped = {};
    Object.entries(globalMatches).forEach(([id, m]) => {
        if(m.pending) return;
        const key = m.group ? 'Group ' + m.group : (m.stage || 'Friendlies');
        if(!grouped[key]) grouped[key] = [];
        grouped[key].push({id, ...m});
    });

    let html = '';
    for(const [title, ms] of Object.entries(grouped)) {
        html += `<div class="card"><div class="card-header">${title}</div><div class="card-body" style="padding:0">`;
        ms.forEach(m => {
            html += `<div class="match-row">
                <div><div>${m.home} v ${m.away}</div><div style="font-size:0.7rem; color:#888">${m.result || 'Active'}</div></div>
                <div class="odds-group">
                    <div class="odd-box ${isAdmin?'admin-disabled':''}" onclick="addToSlip('${m.id}','1','${m.odds['1']}')"><span class="odd-lbl">1</span><span class="odd-val">${m.odds['1']}</span></div>
                    <div class="odd-box ${isAdmin?'admin-disabled':''}" onclick="addToSlip('${m.id}','X','${m.odds['X']}')"><span class="odd-lbl">X</span><span class="odd-val">${m.odds['X']}</span></div>
                    <div class="odd-box ${isAdmin?'admin-disabled':''}" onclick="addToSlip('${m.id}','2','${m.odds['2']}')"><span class="odd-lbl">2</span><span class="odd-val">${m.odds['2']}</span></div>
                </div>
            </div>`;
        });
        html += `</div></div>`;
    }
    document.getElementById('match-list').innerHTML = html || 'No matches found.';
  }

  function renderAdminAllTickets(allUsersTickets) {
    if(!allUsersTickets) { document.getElementById('admin-all-tickets').innerHTML = 'No open bets.'; return; }
    let html = '';
    for(const [user, tickets] of Object.entries(allUsersTickets)) {
        for(const [tId, t] of Object.entries(tickets)) {
            if(t.status !== 'open') continue;
            html += `<div style="font-size:0.75rem; background:#333; padding:8px; border-bottom:1px solid #444; margin-bottom:5px;">
                <b style="color:var(--b365-bright-green)">${user}</b>: ${t.legs.length} Leg Parlay @ ${t.totalOdds.toFixed(2)} ($${t.stake})
                <div style="color:#aaa">${t.legs.map(l => `${l.home} v ${l.away} (${l.pick})`).join(', ')}</div>
            </div>`;
        }
    }
    document.getElementById('admin-all-tickets').innerHTML = html || 'No open tickets.';
  }

  function renderUserTickets(tickets) {
    if(!tickets) { document.getElementById('user-tickets').innerHTML = 'No bets placed.'; return; }
    const html = Object.values(tickets).reverse().map(t => `
        <div style="background:#444; padding:10px; border-radius:4px; margin-bottom:10px; border-left:4px solid ${t.status==='won'?'#12ed80':(t.status==='lost'?'#f44':'#aaa')}">
            <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:#aaa">
                <span>${new Date(t.ts).toLocaleDateString()}</span><span>${t.status.toUpperCase()}</span>
            </div>
            <div style="font-weight:bold; margin:5px 0">${t.legs.length} Leg Parlay @ ${t.totalOdds.toFixed(2)}</div>
            <div style="font-size:0.8rem">${t.legs.map(l => `${l.home} (${l.pick})`).join(' • ')}</div>
            <div style="margin-top:5px; font-size:0.8rem">Stake: $${t.stake} | Payout: $${t.payout.toFixed(2)}</div>
        </div>
    `).join('');
    document.getElementById('user-tickets').innerHTML = html;
  }

  function updateStandings() {
    const stats = {};
    globalTeams.forEach(t => stats[t.id] = { p:0, gd:0 });
    Object.values(globalMatches).forEach(m => {
        if(!m.result || m.stage) return;
        const [h, a] = m.result.split('-').map(Number);
        stats[m.homeId].gd += (h-a); stats[m.awayId].gd += (a-h);
        if(h>a) stats[m.homeId].p+=3; else if(a>h) stats[m.awayId].p+=3; else { stats[m.homeId].p+=1; stats[m.awayId].p+=1; }
    });
    const grps = ['A','B','C','D','E'];
    document.getElementById('standings-area').innerHTML = grps.map(g => {
        const ts = globalTeams.filter(t=>t.group===g).map(t=>({n:t.name, ...stats[t.id]})).sort((a,b)=>b.p-a.p || b.gd-a.gd);
        if(ts.length===0) return '';
        return `<div class="card"><div class="card-header">Group ${g}</div><div class="card-body">
            <table><tr><th>Team</th><th>P</th><th>GD</th></tr>
            ${ts.map(t=>`<tr><td>${t.n}</td><td>${t.p}</td><td>${t.gd}</td></tr>`).join('')}
            </table></div></div>`;
    }).join('');
  }

  function renderLeaderboard(users) {
    if(!users) return;
    const sorted = Object.entries(users).map(([name, d]) => ({ name, credits: d.credits||0, net: (d.credits||0)-(d.initialCredits||100) })).sort((a,b) => b.credits - a.credits);
    const html = `<table><tr><th>User</th><th>Credits</th><th>ROI</th></tr>
    ${sorted.map(u => `<tr><td>${u.name}</td><td style="color:var(--b365-bright-green); font-weight:bold">$${u.credits.toFixed(2)}</td><td style="color:${u.net>=0?'#12ed80':'#f44'}">${u.net>=0?'+':''}${u.net.toFixed(2)}</td></tr>`).join('')}
    </table>`;
    document.getElementById('leaderboard-content').innerHTML = html;
  }

  function renderChat(msgs) {
    if(!msgs) return;
    const html = Object.values(msgs).map(m => `<div class="chat-msg"><b>${m.user}:</b> ${m.text}</div>`).join('');
    const box = document.getElementById('chat-box');
    box.innerHTML = html; box.scrollTop = box.scrollHeight;
  }
  function sendChat() {
    const text = document.getElementById('chatInput').value;
    if(!text) return;
    db.ref('chat').push({ user: currentUser, text, ts: Date.now() });
    document.getElementById('chatInput').value = '';
  }

  function renderAdminMatches() {
    const html = Object.entries(globalMatches).map(([id, m]) => `
        <div style="padding:10px; border-bottom:1px solid #444; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-size:0.8rem">${m.home} v ${m.away} (${m.group||m.stage})</span>
            <button class="refresh-btn" style="padding:4px 8px; font-size:0.7rem" onclick="adminSetResult('${id}')">${m.result || 'Result'}</button>
        </div>
    `).join('');
    document.getElementById('admin-match-list').innerHTML = `<div class="card"><div class="card-header">Settle Matches</div>${html}</div>`;
  }

  function renderAdminTeams() {
    const html = globalTeams.map(t => `<tr><td>${t.name}</td><td>${t.group}</td><td>${calcStrength(t.history).toFixed(1)}</td></tr>`).join('');
    document.getElementById('admin-user-list').innerHTML = `<div class="card"><div class="card-header">Teams</div><table><tr><th>Team</th><th>Grp</th><th>Str</th></tr>${html}</table></div>`;
  }

  function renderBracket() {
    const b = document.getElementById('bracket-display');
    const sf1 = globalMatches['m_sf1'], sf2 = globalMatches['m_sf2'], fin = globalMatches['m_final'];
    if(!sf1 || !sf2) { b.style.display = 'none'; return; }
    b.style.display = 'flex';
    b.innerHTML = `
        <div class="bracket-col">
            <div class="bracket-match"><b>SF1</b><br>${sf1.home} v ${sf1.away}<div class="bracket-status">${sf1.result||''}</div></div>
            <div class="bracket-match"><b>SF2</b><br>${sf2.home} v ${sf2.away}<div class="bracket-status">${sf2.result||''}</div></div>
        </div>
        <div class="bracket-col"><div class="bracket-match" style="border-color:var(--b365-accent-yellow)"><b>FINAL</b><br>${fin?.home||'TBD'} v ${fin?.away||'TBD'}<div class="bracket-status">${fin?.result||''}</div></div></div>
    `;
  }

  function updateDropdowns() {
    ['brSF1H', 'brSF1A', 'brSF2H', 'brSF2A'].forEach(sid => {
        const el = document.getElementById(sid);
        if(el) el.innerHTML = globalTeams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
    });
  }

  async function checkBracketAdvancement() {
    const sf1 = globalMatches['m_sf1'], sf2 = globalMatches['m_sf2'];
    if(sf1?.result && sf2?.result) {
        const getW = (m) => {
            const [h,a] = m.result.split('-').map(Number);
            return h > a ? {id:m.homeId, n:m.home, lid:m.awayId, ln:m.away} : {id:m.awayId, n:m.away, lid:m.homeId, ln:m.home};
        };
        const w1 = getW(sf1), w2 = getW(sf2);
        const updates = {};
        updates['matches/m_final'] = { home: w1.n, homeId: w1.id, away: w2.n, awayId: w2.id, odds: calculateOddsForTeams(globalTeams.find(t=>t.id===w1.id), globalTeams.find(t=>t.id===w2.id)), result:null, stage:'FINAL' };
        updates['matches/m_3rd'] = { home: w1.ln, homeId: w1.lid, away: w2.ln, awayId: w2.lid, odds: calculateOddsForTeams(globalTeams.find(t=>t.id===w1.lid), globalTeams.find(t=>t.id===w2.lid)), result:null, stage:'3RD' };
        await db.ref().update(updates);
    }
  }
</script>
