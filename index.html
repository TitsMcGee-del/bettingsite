<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Betting</title>
  <style>
    /* Updated body to include the background image */
    body {
      font-family: Inter, Arial, sans-serif;
      max-width: 1200px;
      margin: 20px auto;
      padding: 18px;
      color: #111;
      background: url('betting.png') no-repeat center center fixed;
      background-size: cover;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.85);
      padding: 10px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      backdrop-filter: blur(5px);
    }
    h1 { margin: 6px 0; }
    /* Made cards semi-transparent for a modern look */
    .card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 10px;
      padding: 14px;
      margin: 12px 0;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(3px);
    }
    input, select, textarea { padding: 8px; border-radius: 6px; border: 1px solid #d6d9e6; margin: 6px 0; width: 100%; box-sizing: border-box; background: #fff; }
    button { padding: 8px 12px; border-radius: 8px; border: 0; background: #0b63d6; color: #fff; cursor: pointer; font-weight: 600; }
    button.ghost { background: #6c7280; }
    button.small { padding: 6px 8px; font-size: 0.9em; }
    .row { display: flex; gap: 12px; }
    .col { flex: 1; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 8px; border-bottom: 1px solid #eef2f8; text-align: left; }
    th { background: rgba(240, 244, 255, 0.8); }
    .muted { color: #555; }
    .right { text-align: right; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .team-box { padding: 8px; border: 1px solid #ddd; border-radius: 6px; background: rgba(255, 255, 255, 0.5); }
    .score-input { width: 45px !important; text-align: center; display: inline-block; }
  </style>
  <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header>
    <h1>Betting</h1>
    <div id="sessionArea" style="font-weight:bold"></div>
  </header>

  <div id="landing" class="card">
    <strong>Choose role</strong>
    <div class="row" style="margin-top:10px">
      <div class="col"><button onclick="showAdminLogin()">Admin Login</button></div>
      <div class="col"><button onclick="showUserLogin()">User Login</button></div>
    </div>
  </div>

  <div id="adminLogin" class="card" style="display:none">
    <h3>Admin login</h3>
    <input id="adminPass" placeholder="Admin password" type="password" />
    <div class="row"><button onclick="loginAdmin()">Enter Admin</button><button class="ghost" onclick="backToLanding()">Back</button></div>
  </div>

  <div id="userLogin" class="card" style="display:none">
    <h3>User login</h3>
    <input id="usernameIn" placeholder="Username" />
    <input id="userPassIn" placeholder="Password" type="password" />
    <div class="row"><button onclick="loginUser()">Login</button><button class="ghost" onclick="backToLanding()">Back</button></div>
  </div>

  <div id="app" style="display:none">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><strong id="who"></strong> <span id="roleTag" class="muted"></span></div>
        <div><span id="creditsDisplay"></span> <button class="ghost small" onclick="logout()" style="margin-left:10px">Logout</button></div>
      </div>
    </div>

    <div id="adminPanel" style="display:none">
      <div class="card">
        <h3>Results Management (Admin)</h3>
        <p class="muted">Enter scores for both teams and click Save.</p>
        <div id="adminResultsTable"></div>
      </div>

      <div class="card">
        <h3>Database Control</h3>
        <div class="row">
          <div class="col">
            <button onclick="exportResultsAndTeamsXLSX()">Export (XLSX)</button><br><br>
            <button class="ghost" onclick="confirmClearResultsAndTeams()">Clear Database</button>
          </div>
          <div class="col">
            <h4>Quick User Actions</h4>
            <input id="quickNewUserName" placeholder="Username" />
            <input id="quickNewUserPass" placeholder="Password" />
            <input id="quickNewUserCredits" placeholder="Credits" />
            <button onclick="quickAddUser()">Add User</button>
            <hr style="margin:10px 0; border:0; border-top:1px solid #ddd">
            <select id="removeUserSelect"></select>
            <button class="ghost" style="margin-top:8px" onclick="removeSelectedUser()">Remove User</button>
          </div>
        </div>
      </div>

      <div class="card">
        <h3>Teams & Matches</h3>
        <div class="grid">
          <div>
            <h4>Add Team</h4>
            <input id="teamName" placeholder="Team name" />
            <select id="teamGroup"><option value="A">Group A</option><option value="B">Group B</option></select>
            <button onclick="addTeam()">Add Team</button>
            <div id="teamsList" style="margin-top:10px"></div>
          </div>
          <div>
            <h4>Create Match</h4>
            <select id="gmHome"></select> vs <select id="gmAway"></select>
            <select id="gmType">
                <option value="group">Group Match</option>
                <option value="playoff">Play-off</option>
                <option value="final">Final</option>
            </select>
            <div class="row">
              <input id="gmOdd1" placeholder="Odds 1" />
              <input id="gmOddX" placeholder="Odds X" />
              <input id="gmOdd2" placeholder="Odds 2" />
            </div>
            <button onclick="createMatch()">Create Match</button>
          </div>
        </div>
      </div>
    </div>

    <div id="userPanel" style="display:none">
      <div class="card">
        <h3>Place Bets</h3>
        <div id="betsArea"></div>
      </div>
    </div>

    <div class="card">
      <div style="display:flex;gap:16px;flex-wrap:wrap">
        <div style="flex:1;min-width:280px">
          <h4>Leaderboard</h4>
          <div id="leaderboard"></div>
        </div>
        <div style="flex:2;min-width:320px">
          <h4>Results</h4>
          <div id="resultsTable"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Group Standings</h3>
      <div class="row">
        <div class="col"><h4>Group A</h4><div id="groupA"></div></div>
        <div class="col"><h4>Group B</h4><div id="groupB"></div></div>
      </div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyDPgcnptW0O2OFlE-_TOsTXctjG6RPBZm8",
    authDomain: "fc26-full-bets.firebaseapp.com",
    databaseURL: "https://fc26-full-bets-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "fc26-full-bets",
    storageBucket: "fc26-full-bets.firebasestorage.app",
    messagingSenderId: "549879537827",
    appId: "1:549879537827:web:cde58dd532e7e6ffde5f16"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const ADMIN_PASSWORD = 'IBM99ibm';
  let currentUser = null;
  let currentIsAdmin = false;

  function hideAll() { ['landing','adminLogin','userLogin','app'].forEach(id => document.getElementById(id).style.display = 'none'); }
  function showAdminLogin() { hideAll(); document.getElementById('adminLogin').style.display = 'block'; }
  function showUserLogin() { hideAll(); document.getElementById('userLogin').style.display = 'block'; }
  function backToLanding() { hideAll(); document.getElementById('landing').style.display = 'block'; }

  // Session Persistence
  function saveSession(user, isAdmin) { localStorage.setItem('bet_session', JSON.stringify({ user, isAdmin })); }
  function checkSession() {
    const saved = localStorage.getItem('bet_session');
    if (saved) {
        const data = JSON.parse(saved);
        currentUser = data.user;
        currentIsAdmin = data.isAdmin;
        startApp();
    }
  }

  function loginAdmin() {
    if (document.getElementById('adminPass').value === ADMIN_PASSWORD) {
      currentUser = 'Admin'; currentIsAdmin = true;
      saveSession(currentUser, currentIsAdmin);
      startApp();
    } else alert('Wrong password');
  }

  function loginUser() {
    const name = document.getElementById('usernameIn').value.trim();
    const pass = document.getElementById('userPassIn').value;
    db.ref('users/'+name).once('value').then(snap => {
      const data = snap.val();
      if (data && data.pass === pass) { 
          currentUser = name; currentIsAdmin = false; 
          saveSession(currentUser, currentIsAdmin);
          startApp(); 
      }
      else alert('Invalid credentials');
    });
  }

  function logout() { localStorage.removeItem('bet_session'); location.reload(); }

  function startApp() {
    hideAll();
    document.getElementById('app').style.display = 'block';
    document.getElementById('who').textContent = currentUser;
    document.getElementById('roleTag').textContent = currentIsAdmin ? '(Admin)' : '';
    document.getElementById('sessionArea').textContent = currentUser + (currentIsAdmin ? ' (Admin)' : '');
    document.getElementById('adminPanel').style.display = currentIsAdmin ? 'block' : 'none';
    document.getElementById('userPanel').style.display = currentIsAdmin ? 'none' : 'block';
    updateCredits();
    listenAll();
    loadTeams();
    refreshUserDropdown();
  }

  function updateCredits() {
    if (!currentUser || currentIsAdmin) return;
    db.ref('users/'+currentUser+'/credits').on('value', s => {
      document.getElementById('creditsDisplay').textContent = 'Credits: ' + (s.val() || 0);
    });
  }

  async function renderAdminResultsTable() {
    const snap = await db.ref('matches').get();
    const matches = snap.val() || {};
    const rows = Object.keys(matches).map(k => {
      const m = matches[k];
      const existing = m.result ? m.result.split('-') : ['', ''];
      return `<tr>
        <td>${m.home} vs ${m.away}<br><small>${m.type || 'group'}</small></td>
        <td>
            <input id="resH_${k}" value="${existing[0]}" class="score-input" type="number" /> : 
            <input id="resA_${k}" value="${existing[1]}" class="score-input" type="number" />
        </td>
        <td><button class="small" onclick="saveTwoFieldResult('${k}')">Save</button></td>
      </tr>`;
    }).join('');
    document.getElementById('adminResultsTable').innerHTML = `<table><thead><tr><th>Match</th><th>Score</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan=3>No matches</td></tr>'}</tbody></table>`;
  }

  async function saveTwoFieldResult(matchId) {
    const h = document.getElementById('resH_'+matchId).value;
    const a = document.getElementById('resA_'+matchId).value;
    if (h === '' || a === '') {
        await db.ref('matches/'+matchId+'/result').set(null);
        await reverseResolutionsForMatch(matchId);
    } else {
        const val = `${h}-${a}`;
        await db.ref('matches/'+matchId+'/result').set(val);
        await resolveBetsForMatch(matchId, val);
    }
    alert('Result saved!');
  }

  function createMatch() {
    const hId = document.getElementById('gmHome').value;
    const aId = document.getElementById('gmAway').value;
    const mType = document.getElementById('gmType').value;
    if (!hId || !aId || hId === aId) return alert('Select different teams');
    const hName = document.querySelector('#gmHome option:checked').textContent.split(' (')[0];
    const aName = document.querySelector('#gmAway option:checked').textContent.split(' (')[0];
    const o1 = parseFloat(document.getElementById('gmOdd1').value) || 1;
    const oX = parseFloat(document.getElementById('gmOddX').value) || 1;
    const o2 = parseFloat(document.getElementById('gmOdd2').value) || 1;
    const id = 'm_'+Date.now();
    db.ref('matches/'+id).set({id, home: hName, homeId: hId, away: aName, awayId: aId, type: mType, group: (mType==='group'), odds: {'1':o1, 'X':oX, '2':o2}, result: null, created: Date.now()});
    alert('Match Created!');
  }

  async function resolveBetsForMatch(matchId, resultStr) {
    const [mSnap, bSnap] = await Promise.all([db.ref('matches/'+matchId).get(), db.ref('bets').get()]);
    const m = mSnap.val(); if (!m) return;
    const [g1, g2] = resultStr.split('-').map(Number);
    const outcome = g1 > g2 ? '1' : g1 < g2 ? '2' : 'X';
    const bets = bSnap.val() || {};
    for (const u in bets) {
      const b = bets[u][matchId]; if (!b) continue;
      if (b.resolved && b.win) await db.ref('users/'+u+'/credits').transaction(c => (c||0)-(b.payout||0));
      const stake = Number(b.stake) || 0;
      if (b.outcome === outcome) {
        const payout = Math.round(stake * m.odds[outcome] * 100) / 100;
        await db.ref('bets/'+u+'/'+matchId).update({resolved:true, win:true, payout});
        await db.ref('users/'+u+'/credits').transaction(c => (c||0)+payout);
      } else await db.ref('bets/'+u+'/'+matchId).update({resolved:true, win:false, payout:0});
    }
  }

  async function reverseResolutionsForMatch(matchId) {
    const snap = await db.ref('bets').get();
    const bets = snap.val() || {};
    for (const u in bets) {
      const b = bets[u][matchId];
      if (b && b.resolved && b.win) await db.ref('users/'+u+'/credits').transaction(c => (c||0)-(b.payout||0));
      if (b) await db.ref('bets/'+u+'/'+matchId).update({resolved:false, win:false, payout:null});
    }
  }

  function renderResults(matches) {
    const rows = Object.values(matches).map(m => `<tr><td>${m.home} vs ${m.away} <small>(${m.type||'group'})</small></td><td>${m.result || '—'}</td><td>${m.odds['1']}/${m.odds['X']}/${m.odds['2']}</td></tr>`).join('');
    document.getElementById('resultsTable').innerHTML = `<table><thead><tr><th>Match</th><th>Result</th><th>Odds</th></tr></thead><tbody>${rows || '<tr><td>No matches</td></tr>'}</tbody></table>`;
  }

  async function renderGroupStandings(matches) {
    const stats = {};
    Object.values(matches).forEach(m => {
      if (m.type !== 'group' || !m.result) return;
      const [g1, g2] = m.result.split('-').map(Number);
      [m.homeId, m.awayId].forEach(id => stats[id] = stats[id] || {gf:0, ga:0, pts:0});
      stats[m.homeId].gf += g1; stats[m.homeId].ga += g2;
      stats[m.awayId].gf += g2; stats[m.awayId].ga += g1;
      if (g1 > g2) stats[m.homeId].pts += 3; else if (g2 > g1) stats[m.awayId].pts += 3; else { stats[m.homeId].pts+=1; stats[m.awayId].pts+=1; }
    });
    const tSnap = await db.ref('teams').get();
    const teams = tSnap.val() || {};
    const groupA = [], groupB = [];
    Object.values(teams).forEach(t => {
      const s = stats[t.id] || {gf:0, ga:0, pts:0};
      const row = {name: t.name, pts: s.pts, gd: s.gf-s.ga};
      if (t.group === 'A') groupA.push(row); else groupB.push(row);
    });
    const srt = a => a.sort((x,y) => y.pts - x.pts || y.gd - x.gd);
    document.getElementById('groupA').innerHTML = makeTable(srt(groupA));
    document.getElementById('groupB').innerHTML = makeTable(srt(groupB));
  }

  function makeTable(arr) {
    return arr.length ? `<table><thead><tr><th>Team</th><th>Pts</th><th>GD</th></tr></thead><tbody>` + arr.map(r => `<tr><td>${r.name}</td><td>${r.pts}</td><td>${r.gd}</td></tr>`).join('') + `</tbody></table>` : '<div class="muted">No teams</div>';
  }

  async function loadTeams() {
    const snap = await db.ref('teams').get();
    const teams = Object.values(snap.val() || {});
    document.getElementById('teamsList').innerHTML = teams.map(t => `<div class="team-box">${t.name} (G${t.group})</div>`).join('');
    const opts = '<option value="">--</option>' + teams.map(t => `<option value="${t.id}">${t.name} (G${t.group})</option>`).join('');
    ['gmHome','gmAway'].forEach(id => document.getElementById(id).innerHTML = opts);
  }

  async function renderUserBets() {
    if (currentIsAdmin) return;
    const [mSnap, bSnap] = await Promise.all([db.ref('matches').get(), db.ref('bets/'+currentUser).get()]);
    const matches = mSnap.val() || {}, myBets = bSnap.val() || {};
    let h = '';
    Object.keys(matches).sort((a,b)=>matches[b].created-matches[a].created).forEach(k => {
      const m = matches[k], b = myBets[k];
      h += `<div class="card" style="margin:8px 0; background:rgba(255,255,255,0.7)">
        <strong>${m.home} vs ${m.away}</strong> (${m.type||'group'})<br>
        ${m.result ? (b ? `Result: ${m.result} | Your Bet: ${b.outcome} -> <strong>${b.win?'WIN +'+b.payout:'LOSS'}</strong>` : 'No bet placed') : 
        (b ? `Your Bet: ${b.outcome} (${b.stake}) - PENDING` : 
        `<select id="p_${k}"><option value="1">${m.home}</option><option value="X">Draw</option><option value="2">${m.away}</option></select>
         <input id="s_${k}" placeholder="Stake" style="width:70px" />
         <button class="small" onclick="placeBet('${k}', document.getElementById('p_${k}').value, 's_${k}')">Bet</button>`)}
      </div>`;
    });
    document.getElementById('betsArea').innerHTML = h || '<div class="muted">No matches yet</div>';
  }

  async function placeBet(matchId, outcome, stakeId) {
    const stake = Number(document.getElementById(stakeId).value);
    if (!stake || stake <= 0) return alert('Invalid stake');
    const cSnap = await db.ref('users/'+currentUser+'/credits').get();
    if (stake > (cSnap.val()||0)) return alert('Not enough credits');
    await db.ref('users/'+currentUser+'/credits').transaction(c => (c||0)-stake);
    await db.ref('bets/'+currentUser+'/'+matchId).set({outcome, stake, resolved: false});
    alert('Bet placed!');
  }

  function listenAll() {
    db.ref('matches').on('value', snap => { renderResults(snap.val()||{}); renderGroupStandings(snap.val()||{}); renderAdminResultsTable(); });
    db.ref('users').on('value', snap => {
        const users = snap.val() || {};
        const arr = Object.keys(users).map(u => ({name:u, credits: users[u].credits})).sort((a,b)=>b.credits-a.credits);
        document.getElementById('leaderboard').innerHTML = '<table>' + arr.map(r=>`<tr><td>${r.name}</td><td class="right">${r.credits}</td></tr>`).join('') + '</table>';
    });
    db.ref('bets').on('value', () => renderUserBets());
  }

  async function quickAddUser() {
    const u = document.getElementById('quickNewUserName').value.trim();
    const p = document.getElementById('quickNewUserPass').value || '1234';
    const c = Number(document.getElementById('quickNewUserCredits').value) || 1000;
    if (u) { await db.ref('users/'+u).set({pass:p, credits:c}); alert('User added'); refreshUserDropdown(); }
  }

  async function refreshUserDropdown() {
    const snap = await db.ref('users').get();
    const users = snap.val() || {};
    document.getElementById('removeUserSelect').innerHTML = Object.keys(users).map(u => `<option value="${u}">${u}</option>`).join('');
  }

  async function removeSelectedUser() {
    const u = document.getElementById('removeUserSelect').value;
    if (u && confirm('Delete '+u+'?')) { await db.ref('users/'+u).set(null); refreshUserDropdown(); }
  }

  async function addTeam() {
    const name = document.getElementById('teamName').value.trim();
    const group = document.getElementById('teamGroup').value;
    if (!name) return;
    const id = 't_'+Date.now();
    await db.ref('teams/'+id).set({id, name, group});
    document.getElementById('teamName').value = '';
    loadTeams();
  }

  checkSession();
  backToLanding();
</script>
</body>
</html>
