<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bet365 Style Dashboard</title>
  
  <style>
    /* Bet365 Color Palette */
    :root {
      --b365-dark-green: #007355;
      --b365-bright-green: #12ed80;
      --b365-header-bg: #333333;
      --b365-body-bg: #282828;
      --b365-card-bg: #383838;
      --b365-text-white: #ffffff;
      --b365-text-gray: #bbbbbb;
      --b365-accent-yellow: #ffdf1b;
      --b365-border: #444444;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--b365-body-bg);
      color: var(--b365-text-white);
      margin: 0;
      padding: 0;
    }

    /* Header & Refresh */
    header {
      background-color: var(--b365-header-bg);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 3px solid var(--b365-dark-green);
    }

    .refresh-btn {
      background: var(--b365-dark-green);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
    }

    .refresh-btn:hover { background: var(--b365-bright-green); color: #000; }

    /* Tabs Navigation */
    .tab-bar {
      display: flex;
      background: #404040;
      overflow-x: auto;
    }

    .tab-item {
      padding: 12px 20px;
      cursor: pointer;
      border-right: 1px solid var(--b365-border);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--b365-text-gray);
    }

    .tab-item.active {
      background: var(--b365-card-bg);
      color: var(--b365-accent-yellow);
      border-bottom: 2px solid var(--b365-accent-yellow);
    }

    /* Layout Containers */
    .container { padding: 15px; max-width: 1200px; margin: 0 auto; }
    
    .card {
      background: var(--b365-card-bg);
      border-radius: 4px;
      margin-bottom: 15px;
      border: 1px solid var(--b365-border);
    }

    .card-header {
      background: #484848;
      padding: 10px 15px;
      font-weight: bold;
      color: var(--b365-bright-green);
      border-bottom: 1px solid var(--b365-border);
    }

    .card-body { padding: 15px; }

    /* Forms */
    input, select {
      background: #444;
      border: 1px solid #555;
      color: white;
      padding: 10px;
      margin: 5px 0;
      width: 100%;
      box-sizing: border-box;
    }

    button.action-btn {
      background: var(--b365-accent-yellow);
      color: #000;
      border: none;
      padding: 10px;
      width: 100%;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
    }

    /* Tables */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; background: #333; color: var(--b365-text-gray); padding: 10px; font-size: 0.8rem; }
    td { padding: 10px; border-bottom: 1px solid var(--b365-border); }

    /* User Odds Grid */
    .match-row {
      display: grid;
      grid-template-columns: 1fr 200px;
      padding: 15px;
      border-bottom: 1px solid var(--b365-border);
    }

    .odds-group { display: flex; gap: 5px; }
    .odd-box {
      background: #444;
      padding: 8px;
      text-align: center;
      flex: 1;
      cursor: pointer;
      border-radius: 4px;
    }
    .odd-box:hover { background: #555; }
    .odd-val { color: var(--b365-accent-yellow); font-weight: bold; display: block; }
    .odd-lbl { font-size: 0.7rem; color: var(--b365-text-gray); }

    #login-screen { max-width: 400px; margin: 100px auto; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.5.0/firebase-database-compat.js"></script>
</head>
<body>

  <header>
    <div style="font-weight: 900; font-size: 1.5rem; color: var(--b365-bright-green);">bet365 <span style="color:white; font-weight:100; font-size:0.9rem">Clone</span></div>
    <button class="refresh-btn" onclick="location.reload()">REFRESH</button>
  </header>

  <div id="login-screen" class="container">
    <div class="card">
      <div class="card-header">Secure Login</div>
      <div class="card-body">
        <input id="userIn" placeholder="Username" />
        <input id="passIn" placeholder="Password" type="password" />
        <button class="action-btn" onclick="handleLogin()">Login</button>
        <p style="text-align:center; font-size: 0.8rem; color: #888; margin-top: 15px;">Admin use 'Admin' as username</p>
      </div>
    </div>
  </div>

  <div id="app" style="display:none">
    
    <div id="admin-tabs" class="tab-bar" style="display:none">
      <div class="tab-item active" onclick="switchTab('tab-matches', this)">Matches</div>
      <div class="tab-item" onclick="switchTab('tab-teams', this)">Teams</div>
      <div class="tab-item" onclick="switchTab('tab-users', this)">Users</div>
    </div>

    <div class="container">
      
      <div id="admin-content" style="display:none">
        
        <div id="tab-matches" class="tab-pane">
          <div class="card">
            <div class="card-header">Schedule New Match</div>
            <div class="card-body">
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
                <select id="gmHome"></select>
                <select id="gmAway"></select>
              </div>
              <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; margin-top:10px">
                <input id="o1" placeholder="Odd 1" />
                <input id="oX" placeholder="Odd X" />
                <input id="o2" placeholder="Odd 2" />
              </div>
              <button class="action-btn" style="margin-top:10px" onclick="createMatch()">Create Match</button>
            </div>
          </div>
          <div class="card">
            <div class="card-header">Live Settlements</div>
            <div id="admin-match-list"></div>
          </div>
        </div>

        <div id="tab-teams" class="tab-pane" style="display:none">
          <div class="card">
            <div class="card-header">Register New Team</div>
            <div class="card-body">
              <input id="tName" placeholder="Team Name" />
              <select id="tGroup"><option value="A">Group A</option><option value="B">Group B</option></select>
              <button class="action-btn" onclick="registerTeam()">Add Team</button>
            </div>
          </div>
          <div id="admin-teams-list"></div>
        </div>

        <div id="tab-users" class="tab-pane" style="display:none">
          <div class="card">
            <div class="card-header">User Management</div>
            <div class="card-body">
              <div id="user-list-admin"></div>
            </div>
          </div>
        </div>
      </div>

      <div id="user-content" style="display:none">
        <div class="card" style="margin-bottom:20px; border-left: 4px solid var(--b365-bright-green);">
          <div class="card-body" style="display:flex; justify-content:space-between">
            <div>Logged in as: <strong id="display-name"></strong></div>
            <div style="color:var(--b365-accent-yellow)">Balance: <strong id="display-balance">0</strong></div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">Main Events</div>
          <div id="user-betting-odds"></div>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <div class="card-header">League Standings</div>
          <div id="standings"></div>
        </div>
        <div class="card">
          <div class="card-header">Leaderboard</div>
          <div id="rankings"></div>
        </div>
      </div>

    </div>
  </div>

<script>
  // Same Firebase Config
  const firebaseConfig = {
    apiKey: "AIzaSyDPgcnptW0O2OFlE-_TOsTXctjG6RPBZm8",
    authDomain: "fc26-full-bets.firebaseapp.com",
    databaseURL: "https://fc26-full-bets-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "fc26-full-bets",
    storageBucket: "fc26-full-bets.firebasestorage.app",
    messagingSenderId: "549879537827",
    appId: "1:549879537827:web:cde58dd532e7e6ffde5f16"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  let currentUser = null;
  let isAdmin = false;

  function handleLogin() {
    const user = document.getElementById('userIn').value.trim();
    const pass = document.getElementById('passIn').value;

    if (user === 'Admin' && pass === 'IBM99ibm') {
      currentUser = 'Admin'; isAdmin = true; launch();
    } else {
      db.ref('users/'+user).once('value', s => {
        const d = s.val();
        if (d && d.pass === pass) {
          currentUser = user; isAdmin = false; launch();
        } else alert('Invalid Login');
      });
    }
  }

  function launch() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('display-name').textContent = currentUser;
    
    if (isAdmin) {
      document.getElementById('admin-tabs').style.display = 'flex';
      document.getElementById('admin-content').style.display = 'block';
    } else {
      document.getElementById('user-content').style.display = 'block';
      syncUserBalance();
    }
    initListeners();
  }

  function switchTab(id, el) {
    document.querySelectorAll('.tab-pane').forEach(p => p.style.display = 'none');
    document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
    document.getElementById(id).style.display = 'block';
    el.classList.add('active');
  }

  function syncUserBalance() {
    db.ref(`users/${currentUser}/credits`).on('value', s => {
      document.getElementById('display-balance').textContent = s.val() || 0;
    });
  }

  // --- ACTIONS ---
  async function registerTeam() {
    const name = document.getElementById('tName').value.trim();
    const group = document.getElementById('tGroup').value;
    if (!name) return;
    try {
      await db.ref('teams/t_' + Date.now()).set({ name, group });
      document.getElementById('tName').value = '';
    } catch(e) { alert("Permission Error: Check Firebase Rules"); }
  }

  function createMatch() {
    const hId = document.getElementById('gmHome').value;
    const aId = document.getElementById('gmAway').value;
    const hName = document.querySelector('#gmHome option:checked').textContent;
    const aName = document.querySelector('#gmAway option:checked').textContent;
    const odds = { '1': document.getElementById('o1').value, 'X': document.getElementById('oX').value, '2': document.getElementById('o2').value };
    
    db.ref('matches/m_'+Date.now()).set({ home: hName, homeId: hId, away: aName, awayId: aId, odds, result: null });
  }

  async function setScore(id) {
    const res = prompt("Enter Score (e.g. 2-1)");
    if (res) {
      await db.ref(`matches/${id}/result`).set(res);
      // Logic for resolving bets would go here (omitted for brevity)
    }
  }

  // --- REAL TIME SYNC ---
  function initListeners() {
    // Sync Teams
    db.ref('teams').on('value', s => {
      const teams = Object.entries(s.val() || {}).map(([id, d]) => ({id, ...d}));
      const opts = teams.map(t => `<option value="${t.id}">${t.name}</option>`).join('');
      document.getElementById('gmHome').innerHTML = opts;
      document.getElementById('gmAway').innerHTML = opts;
      
      if (isAdmin) {
        document.getElementById('admin-teams-list').innerHTML = teams.map(t => `<div class="team-box" style="padding:10px; border-bottom:1px solid #444">${t.name} (${t.group})</div>`).join('');
      }
    });

    // Sync Matches
    db.ref('matches').on('value', s => {
      const matches = s.val() || {};
      if (isAdmin) renderAdminMatches(matches);
      else renderUserOdds(matches);
      renderHistory(matches);
    });

    // Sync Rankings
    db.ref('users').on('value', s => {
      const users = Object.entries(s.val() || {}).map(([n, d]) => ({n, c: d.credits})).sort((a,b) => b.c - a.c);
      document.getElementById('rankings').innerHTML = `<table>${users.map(u => `<tr><td>${u.n}</td><td style="color:var(--b365-accent-yellow)">${u.c}</td></tr>`).join('')}</table>`;
    });
  }

  function renderAdminMatches(matches) {
    const html = Object.entries(matches).map(([id, m]) => `
      <div style="padding:10px; border-bottom:1px solid #444; display:flex; justify-content:space-between">
        <span>${m.home} vs ${m.away}</span>
        <button class="refresh-btn" onclick="setScore('${id}')">${m.result || 'Set Score'}</button>
      </div>
    `).join('');
    document.getElementById('admin-match-list').innerHTML = html;
  }

  function renderUserOdds(matches) {
    const html = Object.entries(matches).filter(([id, m]) => !m.result).map(([id, m]) => `
      <div class="match-row">
        <div>
          <div style="font-size:0.9rem">${m.home}</div>
          <div style="font-size:0.9rem">${m.away}</div>
        </div>
        <div class="odds-group">
          <div class="odd-box"><span class="odd-lbl">1</span><span class="odd-val">${m.odds['1']}</span></div>
          <div class="odd-box"><span class="odd-lbl">X</span><span class="odd-val">${m.odds['X']}</span></div>
          <div class="odd-box"><span class="odd-lbl">2</span><span class="odd-val">${m.odds['2']}</span></div>
        </div>
      </div>
    `).join('');
    document.getElementById('user-betting-odds').innerHTML = html || '<p style="padding:20px; color:#888">No active matches</p>';
  }

  function renderHistory(matches) {
    const html = Object.values(matches).filter(m => m.result).map(m => `
      <tr><td>${m.home} v ${m.away}</td><td style="color:var(--b365-bright-green)">${m.result}</td></tr>
    `).join('');
    document.getElementById('resultsTable').innerHTML = `<table>${html}</table>`;
  }
</script>

</body>
</html>
